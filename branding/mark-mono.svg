<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 云中箭单色版：颜色跟随 currentColor（在 HTML 中由 CSS color 控制，独立打开时为黑色） -->
  <defs>
    <mask id="arrow-cut">
      <rect width="100" height="100" fill="#fff"/>
      <g stroke="#000" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <line x1="50" y1="39" x2="50" y2="62"/>
        <polyline points="41,54 50,63 59,54"/>
      </g>
    </mask>
  </defs>
  <g fill="currentColor" mask="url(#arrow-cut)">
    <circle cx="30" cy="61" r="13"/>
    <circle cx="50" cy="47" r="20"/>
    <circle cx="69" cy="58" r="14"/>
    <rect x="17" y="51" width="66" height="23" rx="11.5"/>
  </g>
</svg>
