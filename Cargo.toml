[package]
name = "baidu-transfer-monitor"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.105"
gpui = "0.2.2"
raw-window-handle = "0.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.40.4"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_Graphics_Dwm"] }

[target."cfg(unix)".dependencies]
libc = "0.2.191"

[build-dependencies]
winresource = "0.1.34"
